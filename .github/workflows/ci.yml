name: Cog Engine CI & Cross-Platform Validation

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test-matrix:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        exclude:
          - os: macos-latest
            python-version: '3.8'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure Git User (for PR/Diff tests in CI)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Automated Unit & Regression Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Validate CLI Workflows & Subcommands (POSIX)
        if: runner.os != 'Windows'
        run: |
          chmod +x Ctx

          # 1. Test Project Initialization & Scaffolding
          ./Ctx init --force

          # 2. Test Doctor Diagnostics
          ./Ctx doctor

          # 3. Test Full Context Generation
          ./Ctx

          # 4. Test Modular Domain Slices
          ./Ctx sw
          ./Ctx docs
          ./Ctx hld

          # 5. Test Git & Diff Slicers
          ./Ctx git
          ./Ctx git:full
          ./Ctx diff

          # 6. Test Output Override & Modifiers
          ./Ctx --no-banner --no-git -o context/custom_ci_summary.txt

          echo "✅ All POSIX CLI subcommands executed successfully!"

      - name: Validate CLI Workflows & Subcommands (Windows CMD)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          :: Set UTF-8 codepage in runner
          chcp 65001 >nul

          :: 1. Test Scaffolding
          python core\__main__.py init --force

          :: 2. Test Doctor
          python core\__main__.py doctor

          :: 3. Test Full Context
          python core\__main__.py

          :: 4. Test Slices & Git
          python core\__main__.py sw
          python core\__main__.py git
          python core\__main__.py diff

          :: 5. Test Windows CMD Wrapper
          call Ctx.cmd check

          echo "✅ All Windows CLI subcommands executed successfully!"